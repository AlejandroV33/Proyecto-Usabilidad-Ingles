<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- WCAG 2.4.2 — Descriptive page title -->
    <title>Shimi – Learn English B1</title>
    <meta name="description" content="Shimi: your English B1 learning companion. Start your journey today.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .splash-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: var(--spacing-xl);
        }

        .logo-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .logo-box {
            width: 120px;
            height: 120px;
            background-color: var(--primary-color);
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            box-shadow: 0 8px 0px #e6952d;
            transform: rotate(-3deg);
        }

        .logo-box i {
            font-size: 4rem;
            color: white;
        }

        h1.main-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-color);
            max-width: 300px;
            line-height: 1.2;
        }

        .footer-section {
            width: 100%;
            padding-bottom: var(--spacing-xl);
        }

        .btn-start {
            padding: 20px;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <!-- WCAG 2.4.1 — Skip link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="container fade-in">
        <main id="main-content" class="splash-container">
            <div class="logo-section">
                <!-- WCAG 1.1.1 — Decorative icon hidden from screen readers -->
                <div class="logo-box" role="img" aria-label="Shimi app logo">
                    <i class="fas fa-dove" aria-hidden="true"></i>
                </div>
                <h1 class="main-title">Ready to learn English?</h1>
            </div>

            <div class="footer-section">
                <!-- WCAG 2.4.4 — Descriptive link purpose -->
                <a href="pages/register.html" class="btn btn-primary btn-start">
                    GET STARTED
                </a>
                <p style="margin-top: var(--spacing-md); color: var(--text-muted); font-size: 0.9rem;">
                    Already have an account?
                    <a href="pages/login.html" style="color: var(--primary-color); font-weight: 600;">
                        Log in here
                    </a>
                </p>
            </div>
        </main>
    </div>
</body>
</html>
