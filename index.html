<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimi - Start</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .splash-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: var(--spacing-xl);
        }

        .logo-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .logo-box {
            width: 120px;
            height: 120px;
            background-color: var(--primary-color);
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            box-shadow: 0 8px 0px #e6952d;
            transform: rotate(-3deg);
        }

        .logo-box i {
            font-size: 4rem;
            color: white;
        }

        h1.main-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-color);
            max-width: 300px;
            line-height: 1.2;
        }

        .footer-section {
            width: 100%;
            padding-bottom: var(--spacing-xl);
        }

        .btn-start {
            padding: 20px;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <div class="splash-container">
            <div class="logo-section">
                <div class="logo-box">
                    <i class="fas fa-dove"></i>
                </div>
                <h1 class="main-title" data-i18n="appReady">Ready to learn English?</h1>
            </div>
            
            <div class="footer-section">
                <a href="pages/onboarding.html" class="btn btn-primary btn-start" data-i18n="start">Start</a>
            </div>
        </div>
    </div>
    <script src="js/i18n.js"></script>
</body>
</html>
