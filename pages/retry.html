<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimi - Retry</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .exercise-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding-top: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .close-btn {
            font-size: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            padding: 5px;
        }

        .progress-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background-color: #E0E0E0;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .progress-bar-fill {
            width: 50%; /* Simulating 1/2 errors corrected */
            height: 100%;
            background-color: var(--error-color); /* Red for errors/retry context */
            border-radius: 6px;
        }

        .error-count-text {
            font-size: 0.8rem;
            color: var(--error-color);
            font-weight: 700;
        }

        .main-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: var(--spacing-xl);
            color: var(--text-color);
        }

        /* Question Card */
        .question-card {
            background: white;
            border: 2px solid #E0E0E0;
            border-radius: 20px;
            padding: var(--spacing-xl);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: var(--spacing-xl);
            box-shadow: 0 4px 0px #E0E0E0;
        }

        .question-icon {
            font-size: 3.5rem;
            color: var(--secondary-color);
            margin-bottom: var(--spacing-md);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-color);
        }

        /* Options */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .option-btn {
            background: white;
            border: 2px solid #E0E0E0;
            border-radius: var(--radius);
            padding: var(--spacing-md);
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            box-shadow: 0 4px 0px #E0E0E0;
        }

        .option-btn:hover {
            background-color: #F8F9FA;
            border-color: var(--primary-color);
        }

        .option-btn.selected {
            background-color: #FFF3E0;
            border-color: var(--primary-color);
            color: var(--primary-color);
            box-shadow: 0 4px 0px var(--primary-color);
            transform: translateY(2px);
        }

        .footer-action {
            margin-top: auto;
            padding: var(--spacing-lg) 0;
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <!-- Cabecera -->
        <header class="exercise-header">
            <a href="levels.html" class="close-btn"><i class="fas fa-times"></i></a>
            <div class="progress-wrapper">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill"></div>
                </div>
                <span class="error-count-text">1/2 errors</span>
            </div>
        </header>

        <!-- Título -->
        <h1 class="main-title">Try again</h1>

        <div id="exercise-vocab" class="exercise-type hidden">
            <!-- Tarjeta de Pregunta -->
            <div class="question-card">
                <div class="question-icon"><i class="fas fa-book-open"></i></div>
                <p class="question-text" id="vocabQuestion">"Loading..."</p>
            </div>
            <!-- Opciones -->
            <div class="options-grid" id="vocabOptions"></div>
        </div>

        <div id="exercise-grammar" class="exercise-type hidden">
            <div class="answer-area" id="answerArea" style="min-height: 80px; border-bottom: 2px solid #E0E0E0; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px;"></div>
            <div class="word-pool" id="wordPool" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;"></div>
        </div>

        <!-- Botón de Acción -->
        <div class="footer-action">
            <button id="checkBtn" class="btn btn-primary" disabled onclick="handleCheck()">RETRY NOW</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/exercises.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const levelId = parseInt(urlParams.get('level')) || 1;
        const step = parseInt(urlParams.get('step')) || 0;
        const statsStr = urlParams.get('stats') || '0,0';
        
        let currentExercise = null;
        let selectedOptionIndex = -1;

        async function initRetry() {
            const levelData = await getExercisesForLevel(levelId);
            if (levelData && levelData.exercises[step]) {
                currentExercise = levelData.exercises[step];
                renderExercise(currentExercise);
            }
        }

        function renderExercise(ex) {
            if (ex.type === 'vocabulary') {
                document.getElementById('exercise-vocab').classList.remove('hidden');
                document.getElementById('vocabQuestion').innerText = `"${ex.question}"`;
                const grid = document.getElementById('vocabOptions');
                grid.innerHTML = '';
                ex.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    btn.onclick = () => {
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedOptionIndex = i;
                        document.getElementById('checkBtn').disabled = false;
                    };
                    grid.appendChild(btn);
                });
            } else if (ex.type === 'grammar') {
                document.getElementById('exercise-grammar').classList.remove('hidden');
                const pool = document.getElementById('wordPool');
                ex.words.forEach(word => {
                    const chip = document.createElement('div');
                    chip.className = 'word-chip';
                    chip.innerText = word;
                    chip.style = "background: white; border: 2px solid #E0E0E0; border-radius: 10px; padding: 8px 16px; cursor: pointer;";
                    chip.onclick = () => addWord(chip);
                    pool.appendChild(chip);
                });
            }
        }

        function addWord(el) {
            if (el.classList.contains('used')) return;
            const area = document.getElementById('answerArea');
            const newChip = el.cloneNode(true);
            newChip.onclick = () => { area.removeChild(newChip); el.classList.remove('used'); };
            area.appendChild(newChip);
            el.classList.add('used');
            document.getElementById('checkBtn').disabled = false;
        }

        function handleCheck() {
            let isCorrect = false;
            if (currentExercise.type === 'vocabulary') {
                isCorrect = (selectedOptionIndex === currentExercise.correct);
            } else if (currentExercise.type === 'grammar') {
                const userSentence = Array.from(document.getElementById('answerArea').children)
                    .map(c => c.innerText).join(' ').toLowerCase();
                isCorrect = (userSentence === currentExercise.correct.toLowerCase());
            }

            if (isCorrect) {
                alert('Success! Now let\'s continue with the next exercise.');
                // Return to exercise.html at the NEXT step
                window.location.href = `exercise.html?level=${levelId}&step=${step + 1}&stats=${statsStr}`;
            } else {
                alert('Still not quite right. Look at the options carefully.');
            }
        }

        initRetry();
    </script>
</body>
</html>
