<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimi - Try Again</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .exercise-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding-top: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .close-btn {
            font-size: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            padding: 5px;
        }

        .progress-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background-color: #E0E0E0;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--error-color);
            border-radius: 6px;
            transition: width 0.3s ease;
        }

        .error-count-text {
            font-size: 0.8rem;
            color: var(--error-color);
            font-weight: 700;
        }

        .main-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: var(--spacing-sm);
            color: var(--text-color);
        }

        .main-subtitle {
            text-align: center;
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: var(--spacing-xl);
        }

        /* Question Card */
        .question-card {
            background: white;
            border: 2px solid #E0E0E0;
            border-radius: 20px;
            padding: var(--spacing-xl);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: var(--spacing-xl);
            box-shadow: 0 4px 0px #E0E0E0;
        }

        .question-icon {
            font-size: 3.5rem;
            color: var(--secondary-color);
            margin-bottom: var(--spacing-md);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-color);
        }

        /* Options */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
        }

        .option-btn {
            background: white;
            border: 2px solid #E0E0E0;
            border-radius: var(--radius);
            padding: var(--spacing-md);
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            box-shadow: 0 4px 0px #E0E0E0;
        }

        .option-btn:hover {
            background-color: #F8F9FA;
            border-color: var(--primary-color);
        }

        .option-btn.selected {
            background-color: #FFF3E0;
            border-color: var(--primary-color);
            color: var(--primary-color);
            box-shadow: 0 4px 0px var(--primary-color);
            transform: translateY(2px);
        }

        .option-btn.correct-answer {
            background-color: #EDFFF6;
            border-color: var(--success-color);
            color: var(--success-color);
            box-shadow: 0 4px 0px #00a383;
        }

        .option-btn.wrong-answer {
            background-color: #FFF0F0;
            border-color: var(--error-color);
            color: var(--error-color);
            box-shadow: none;
        }

        /* Word chips */
        .word-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: var(--spacing-lg);
        }

        .word-chip {
            background: white;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 0px #E0E0E0;
            transition: all 0.15s;
        }

        .word-chip:hover {
            border-color: var(--primary-color);
        }

        .word-chip.used {
            opacity: 0.3;
            pointer-events: none;
        }

        .answer-area {
            min-height: 56px;
            width: 100%;
            border-bottom: 2px solid #E0E0E0;
            margin-bottom: var(--spacing-lg);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding-bottom: 10px;
        }

        .answer-area .word-chip {
            background: #FFF3E0;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .feedback-bar {
            display: none;
            padding: var(--spacing-md);
            border-radius: var(--radius);
            text-align: center;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: var(--spacing-md);
        }

        .feedback-bar.correct {
            background: #EDFFF6;
            color: var(--success-color);
            border: 2px solid var(--success-color);
            display: block;
        }

        .feedback-bar.wrong {
            background: #FFF0F0;
            color: var(--error-color);
            border: 2px solid var(--error-color);
            display: block;
        }

        .footer-action {
            margin-top: auto;
            padding: var(--spacing-lg) 0;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <header class="exercise-header">
            <a href="levels.html" class="close-btn"><i class="fas fa-times"></i></a>
            <div class="progress-wrapper">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="errorProgressBar" style="width: 0%"></div>
                </div>
                <span class="error-count-text" id="errorCountText">Retry exercise</span>
            </div>
        </header>

        <h1 class="main-title">Try again</h1>
        <p class="main-subtitle">You got this! Review and answer correctly.</p>

        <div id="exercise-vocab" class="exercise-type hidden">
            <div class="question-card">
                <div class="question-icon"><i class="fas fa-book-open"></i></div>
                <p class="question-text" id="vocabQuestion">"Loading..."</p>
            </div>
            <div class="options-grid" id="vocabOptions"></div>
        </div>

        <div id="exercise-grammar" class="exercise-type hidden">
            <div class="answer-area" id="answerArea"></div>
            <div class="word-pool" id="wordPool"></div>
        </div>

        <div id="feedbackBar" class="feedback-bar"></div>

        <div class="footer-action">
            <button id="checkBtn" class="btn btn-primary" disabled onclick="handleCheck()">RETRY NOW</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/exercises.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const levelId = parseInt(urlParams.get('level')) || 1;
        const step = parseInt(urlParams.get('step')) || 0;
        const statsStr = urlParams.get('stats') || '0,0';

        let currentExercise = null;
        let selectedOptionIndex = -1;
        let checkPhase = false; // true after first submit (showing result)

        // Parse stats to show real error count
        const statParts = statsStr.split(',');
        const incorrectSoFar = parseInt(statParts[1]) || 1;
        document.getElementById('errorProgressBar').style.width = '50%';
        document.getElementById('errorCountText').innerText = incorrectSoFar + ' mistake' + (incorrectSoFar > 1 ? 's' : '') + ' to fix';

        async function initRetry() {
            const levelData = await getExercisesForLevel(levelId);
            if (levelData && levelData.exercises[step]) {
                currentExercise = levelData.exercises[step];
                renderExercise(currentExercise);
            } else {
                window.location.href = `exercise.html?level=${levelId}&step=${step + 1}&stats=${statsStr}`;
            }
        }

        function renderExercise(ex) {
            if (ex.type === 'vocabulary') {
                document.getElementById('exercise-vocab').classList.remove('hidden');
                document.getElementById('vocabQuestion').innerText = '"' + ex.question + '"';
                const grid = document.getElementById('vocabOptions');
                grid.innerHTML = '';
                ex.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.id = 'opt-' + i;
                    btn.innerText = opt;
                    btn.onclick = () => {
                        if (checkPhase) return;
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedOptionIndex = i;
                        document.getElementById('checkBtn').disabled = false;
                    };
                    grid.appendChild(btn);
                });
            } else if (ex.type === 'grammar') {
                document.getElementById('exercise-grammar').classList.remove('hidden');
                const pool = document.getElementById('wordPool');
                ex.words.forEach(word => {
                    const chip = document.createElement('div');
                    chip.className = 'word-chip';
                    chip.innerText = word;
                    chip.onclick = () => addWord(chip);
                    pool.appendChild(chip);
                });
            }
        }

        function addWord(el) {
            if (el.classList.contains('used') || checkPhase) return;
            const area = document.getElementById('answerArea');
            const newChip = document.createElement('div');
            newChip.className = 'word-chip';
            newChip.innerText = el.innerText;
            newChip.onclick = () => {
                if (checkPhase) return;
                area.removeChild(newChip);
                el.classList.remove('used');
                if (area.children.length === 0) document.getElementById('checkBtn').disabled = true;
            };
            area.appendChild(newChip);
            el.classList.add('used');
            document.getElementById('checkBtn').disabled = false;
        }

        function handleCheck() {
            if (checkPhase) {
                // Second press: continue to next exercise
                window.location.href = `exercise.html?level=${levelId}&step=${step + 1}&stats=${statsStr}`;
                return;
            }

            let isCorrect = false;
            if (currentExercise.type === 'vocabulary') {
                isCorrect = (selectedOptionIndex === currentExercise.correct);

                // Highlight correct/wrong
                document.querySelectorAll('.option-btn').forEach((btn, i) => {
                    if (i === currentExercise.correct) btn.classList.add('correct-answer');
                    else if (i === selectedOptionIndex && !isCorrect) btn.classList.add('wrong-answer');
                });

            } else if (currentExercise.type === 'grammar') {
                const userSentence = Array.from(document.getElementById('answerArea').children)
                    .map(c => c.innerText).join(' ').toLowerCase();
                isCorrect = (userSentence === currentExercise.correct.toLowerCase());
            }

            const bar = document.getElementById('feedbackBar');
            if (isCorrect) {
                bar.className = 'feedback-bar correct';
                bar.innerHTML = '<i class="fas fa-check-circle"></i> Correct! Great job!';
                document.getElementById('checkBtn').innerText = 'CONTINUE →';
            } else {
                bar.className = 'feedback-bar wrong';
                bar.innerHTML = '<i class="fas fa-times-circle"></i> Not quite. The correct answer is: <br><b>' + (currentExercise.type === 'vocabulary' ? currentExercise.options[currentExercise.correct] : currentExercise.correct) + '</b>';
                document.getElementById('checkBtn').innerText = 'CONTINUE ANYWAY →';
            }
            document.getElementById('checkBtn').disabled = false;
            checkPhase = true;
        }

        initRetry();
    </script>
</body>
</html>
