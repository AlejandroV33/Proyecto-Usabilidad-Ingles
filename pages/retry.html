<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimi - Reintentar</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .exercise-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding-top: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .close-btn {
            color: var(--text-muted);
            text-decoration: none;
            padding: var(--spacing-sm);
            font-weight: 800;
        }

        .progress-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background-color: #E0E0E0;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .progress-bar-fill {
            width: 50%; /* Simulating 1/2 errors corrected */
            height: 100%;
            background-color: var(--error-color); /* Red for errors/retry context */
            border-radius: 6px;
        }

        .error-count-text {
            font-size: 0.8rem;
            color: var(--error-color);
            font-weight: 700;
        }

        .main-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: var(--spacing-xl);
            color: var(--text-color);
        }

        /* Question Card */
        .question-card {
            background: white;
            border: 2px solid #E0E0E0;
            border-radius: 20px;
            padding: var(--spacing-xl);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: var(--spacing-xl);
            box-shadow: 0 4px 0px #E0E0E0;
        }

        .question-icon {
            font-size: 3.5rem;
            color: var(--secondary-color);
            margin-bottom: var(--spacing-md);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-color);
        }

        /* Options */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .option-btn {
            background: white;
            border: 2px solid #E0E0E0;
            border-radius: var(--radius);
            padding: var(--spacing-md);
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            box-shadow: 0 4px 0px #E0E0E0;
        }

        .option-btn:hover {
            background-color: #F8F9FA;
            border-color: var(--primary-color);
        }

        .option-btn.selected {
            background-color: #FFF3E0;
            border-color: var(--primary-color);
            color: var(--primary-color);
            box-shadow: 0 4px 0px var(--primary-color);
            transform: translateY(2px);
        }

        .footer-action {
            margin-top: auto;
            padding: var(--spacing-lg) 0;
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <!-- Cabecera -->
        <header class="exercise-header">
            <a href="levels.html" class="close-btn">Volver a niveles</a>
            <div class="progress-wrapper">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill"></div>
                </div>
                <span class="error-count-text">1/2 errores</span>
            </div>
        </header>

        <!-- Título -->
        <h1 class="main-title">Intenta de nuevo</h1>

        <!-- Tarjeta de Pregunta -->
        <div class="question-card">
            <div class="question-icon">
                <i class="fas fa-dumbbell"></i>
            </div>
            <p class="question-text">"She ......... to the gym every morning."</p>
        </div>

        <!-- Opciones -->
        <div class="options-grid">
            <button type="button" class="option-btn">A. go</button>
            <button type="button" class="option-btn">B. goes</button>
            <button type="button" class="option-btn">C. going</button>
            <button type="button" class="option-btn">D. gone</button>
        </div>

        <div class="feedback-panel hidden" id="feedbackPanel" role="status" aria-live="polite"></div>

        <!-- Botón de Acción -->
        <div class="footer-action">
            <button id="checkBtn" type="button" class="btn btn-primary" disabled>COMPROBAR</button>
            <a id="continueBtn" href="evaluation.html" class="btn btn-primary hidden">HACER DIAGNÓSTICO DE NIVEL</a>
        </div>
    </div>

    <script>
        const retryOptions = Array.from(document.querySelectorAll('.option-btn'));
        const retryCheckBtn = document.getElementById('checkBtn');

        retryOptions.forEach((button) => {
            button.addEventListener('click', () => selectOption(button));
        });
        retryCheckBtn.addEventListener('click', handleCheck);

        function selectOption(el) {
            retryOptions.forEach(btn => {
                btn.classList.remove('selected');
            });
            el.classList.add('selected');
            retryCheckBtn.disabled = false;
        }

        function handleCheck() {
            const selected = document.querySelector('.option-btn.selected');
            const feedbackPanel = document.getElementById('feedbackPanel');
            const continueBtn = document.getElementById('continueBtn');
            if (selected.innerText.includes('goes')) {
                feedbackPanel.className = 'feedback-panel success';
                feedbackPanel.innerHTML = '<h3>Correcto</h3><p>“Goes” funciona con “she” en presente simple.</p><p><strong>Siguiente:</strong> continúa con la evaluación posterior.</p>';
                retryCheckBtn.classList.add('hidden');
                continueBtn.classList.remove('hidden');
            } else {
                feedbackPanel.className = 'feedback-panel error';
                feedbackPanel.innerHTML = '<h3>Incorrecto</h3><p>Recuerda: con “she” usamos el verbo con “s” en presente simple.</p><p><strong>Acción:</strong> revisa y elige otra opción.</p>';
                retryCheckBtn.disabled = true;
            }
        }
    </script>
</body>
</html>
