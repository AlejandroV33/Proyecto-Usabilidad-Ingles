<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimi - About you</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .onboarding-header {
            text-align: center;
            margin-bottom: var(--spacing-lg);
            padding-top: var(--spacing-md);
        }

        .onboarding-header h1 {
            font-size: 1.8rem;
            margin-bottom: var(--spacing-xs);
        }

        .onboarding-header p {
            color: var(--text-muted);
            font-weight: 500;
        }

        .divider {
            height: 2px;
            background-color: #E0E0E0;
            width: 100%;
            margin: var(--spacing-md) 0;
            border-radius: 2px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            color: var(--text-color);
        }

        .section-title i {
            color: var(--primary-color);
            width: 20px;
            text-align: center;
        }

        .subtext {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: var(--spacing-sm);
        }

        /* Time Grid */
        .time-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .time-option {
            background: white;
            border: 2px solid #E0E0E0;
            border-radius: var(--radius);
            padding: var(--spacing-md);
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            box-shadow: 0 4px 0px #E0E0E0;
        }

        .time-option:hover {
            border-color: var(--primary-color);
            background-color: #FFF9F0;
        }

        .time-option.selected {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 4px 0px #e6952d;
        }

        .footer-note {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: var(--spacing-md);
        }

        form {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-content {
            flex: 1;
        }

        .btn-continue {
            margin-top: auto;
            margin-bottom: var(--spacing-xs);
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <div class="onboarding-header">
            <h1>Hi, this is Shimi</h1>
            <p>Tell us about yourself</p>
            <div class="divider"></div>
        </div>

        <form id="onboardingForm">
            <div class="form-content">
                <!-- Nombre -->
                <div class="input-group">
                    <div class="section-title">
                        <i class="fas fa-user"></i>
                        <span>Name or Nickname</span>
                    </div>
                    <input type="text" id="nickname" placeholder="e.g. Alex" required>
                </div>

                <!-- Edad -->
                <div class="input-group">
                    <div class="section-title">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Age</span>
                    </div>
                    <input type="number" id="age" placeholder="Your age" required min="1">
                </div>

                <!-- Tiempo Diario -->
                <div class="input-group">
                    <div class="section-title">
                        <i class="fas fa-clock"></i>
                        <span>Daily time</span>
                    </div>
                    <p class="subtext">How much time can you dedicate each day?</p>
                    
                    <div class="time-grid">
                        <div class="time-option" onclick="selectTime(this)">10 min</div>
                        <div class="time-option" onclick="selectTime(this)">15 min</div>
                        <div class="time-option" onclick="selectTime(this)">25 min</div>
                        <div class="time-option" onclick="selectTime(this)">30 min</div>
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary btn-continue">CONTINUE</button>
            <p class="footer-note">Complete all fields before continuing</p>
        </form>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/profile.js"></script>

    <script>
        let selectedDailyTime = '';

        function selectTime(element) {
            document.querySelectorAll('.time-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
            selectedDailyTime = element.innerText;
        }

        document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            
            if (!selectedDailyTime) {
                alert('Please select a daily time goal.');
                return;
            }

            const nickname = document.getElementById('nickname').value;
            const age = parseInt(document.getElementById('age').value);

            submitBtn.disabled = true;
            submitBtn.innerText = 'SAVING...';

            try {
                await updateProfile({
                    nickname: nickname,
                    age: age,
                    daily_time: selectedDailyTime
                });
                window.location.href = 'levels.html';
            } catch (error) {
                alert('Error saving profile: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = 'CONTINUE';
            }
        });
    </script>
</body>
</html>
