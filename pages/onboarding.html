<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- WCAG 2.4.2 — Descriptive page title -->
    <title>Shimi – Tell Us About You</title>
    <meta name="description" content="Set up your learning profile: name, age and daily study time.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .onboarding-header {
            text-align: center;
            margin-bottom: var(--spacing-lg);
            padding-top: var(--spacing-md);
        }

        .onboarding-header h1 {
            font-size: 1.8rem;
            margin-bottom: var(--spacing-xs);
        }

        .onboarding-header p {
            color: var(--text-muted);
            font-weight: 500;
        }

        .divider {
            height: 2px;
            background-color: #E0E0E0;
            width: 100%;
            margin: var(--spacing-md) 0;
            border-radius: 2px;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            color: var(--text-color);
        }

        .section-label i {
            color: var(--primary-color);
            width: 20px;
            text-align: center;
        }

        .subtext {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: var(--spacing-sm);
        }

        /* Time selection grid — WCAG 1.3.1 uses <button> for interactivity */
        .time-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        @media (max-width: 340px) {
            .time-grid { grid-template-columns: 1fr; }
        }

        /* WCAG 1.4.1 — selected state uses border + color (not color alone) */
        .time-option {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            padding: var(--spacing-md);
            font-weight: 700;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            box-shadow: 0 4px 0px #CACFD2;
            min-height: 44px;           /* WCAG 2.5.8 */
        }

        .time-option:hover {
            border-color: var(--primary-color);
            background-color: #FFF9F0;
        }

        /* Selected: bold border + background change + check icon in SR text */
        .time-option.selected {
            background-color: var(--primary-color);
            color: #2D3436;   /* AA fix: texto oscuro sobre naranja (antes 1.78:1) */
            border-color: var(--primary-color);
            box-shadow: 0 4px 0px #e6952d;
        }

        .time-option[aria-pressed="true"] {
            background-color: var(--primary-color);
            color: #2D3436;   /* AA fix: texto oscuro sobre naranja (antes 1.78:1) */
            border-color: var(--primary-color);
            box-shadow: 0 4px 0px #e6952d;
        }

        .footer-note {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: var(--spacing-md);
        }

        form {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-content {
            flex: 1;
        }

        .btn-continue {
            margin-top: auto;
            margin-bottom: var(--spacing-xs);
        }
    </style>
</head>
<body>
    <!-- WCAG 2.4.1 — Skip link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="container fade-in">
        <header class="onboarding-header" role="banner">
            <h1>Hi, this is Shimi!</h1>
            <p>Tell us about yourself so we can personalise your learning</p>
            <div class="divider" role="presentation"></div>
        </header>

        <main id="main-content" tabindex="-1">
            <form id="onboardingForm" novalidate>
                <div class="form-content">

                    <!-- WCAG 1.3.1 — label bound to input via for/id -->
                    <div class="input-group">
                        <label for="nickname">
                            <span class="section-label">
                                <i class="fas fa-user" aria-hidden="true"></i>
                                Name or nickname<span class="required-asterisk">*</span>
                            </span>
                        </label>
                        <input type="text"
                               id="nickname"
                               name="name"
                               autocomplete="name"
                               placeholder="e.g. Alex"
                               required
                               aria-required="true">
                        <span id="nickname-error" class="password-hint" style="color: var(--error-color); display: none;"></span>
                    </div>

                    <!-- WCAG 1.3.1 — label bound to input -->
                    <div class="input-group">
                        <label for="age">
                            <span class="section-label">
                                <i class="fas fa-calendar-alt" aria-hidden="true"></i>
                                Age<span class="required-asterisk">*</span>
                            </span>
                        </label>
                        <input type="number"
                               id="age"
                               name="age"
                               autocomplete="bday-year"
                               placeholder="Your age"
                               required
                               aria-required="true"
                               min="1"
                               max="120">
                        <span id="age-error" class="password-hint" style="color: var(--error-color); display: none;"></span>
                    </div>

                    <!-- WCAG 1.3.1 — fieldset/legend groups the radio-like buttons -->
                    <fieldset style="border: none; padding: 0; margin: 0 0 var(--spacing-md) 0;">
                        <legend>
                            <span class="section-label">
                                <i class="fas fa-clock" aria-hidden="true"></i>
                                Daily study time<span class="required-asterisk">*</span>
                            </span>
                        </legend>
                        <p class="subtext" id="time-hint">How much time can you dedicate each day?</p>

                        <!-- WCAG 2.1.1 — buttons are keyboard operable; aria-pressed reflects state -->
                        <div class="time-grid" role="group" aria-describedby="time-hint">
                            <button type="button"
                                    class="time-option"
                                    data-value="10 min"
                                    aria-pressed="false">
                                10 min
                            </button>
                            <button type="button"
                                    class="time-option"
                                    data-value="15 min"
                                    aria-pressed="false">
                                15 min
                            </button>
                            <button type="button"
                                    class="time-option"
                                    data-value="25 min"
                                    aria-pressed="false">
                                25 min
                            </button>
                            <button type="button"
                                    class="time-option"
                                    data-value="30 min"
                                    aria-pressed="false">
                                30 min
                            </button>
                        </div>
                        <span id="time-error" class="password-hint" style="color: var(--error-color); display: none;"></span>
                    </fieldset>
                </div>

                <!-- WCAG 4.1.3 — Inline live status region -->
                <div id="statusMessage"
                     class="alert-message"
                     role="alert"
                     aria-live="assertive"
                     aria-atomic="true"></div>

                <button type="submit"
                        id="submitBtn"
                        class="btn btn-primary btn-continue">
                    CONTINUE
                </button>
                <p class="footer-note" aria-live="polite">Complete all fields before continuing</p>
            </form>
        </main>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/profile.js"></script>

    <script>
        let selectedDailyTime = '';

        // WCAG 2.1.1 — keyboard-accessible toggle buttons with aria-pressed
        document.querySelectorAll('.time-option').forEach(btn => {
            btn.addEventListener('click', () => selectTime(btn));
        });

        function selectTime(element) {
            // Deselect all
            document.querySelectorAll('.time-option').forEach(opt => {
                opt.classList.remove('selected');
                opt.setAttribute('aria-pressed', 'false');
            });
            // Select clicked
            element.classList.add('selected');
            element.setAttribute('aria-pressed', 'true');
            selectedDailyTime = element.dataset.value;
        }

        let lastSaveData = null;

        function showInputError(input, errorId, message) {
            const errorSpan = document.getElementById(errorId);
            if(errorSpan) {
                errorSpan.textContent = message;
                errorSpan.style.display = 'block';
            }
            if(input && input.setAttribute) input.setAttribute('aria-invalid', 'true');
        }

        function clearInputError(input, errorId) {
            const errorSpan = document.getElementById(errorId);
            if(errorSpan) {
                errorSpan.textContent = '';
                errorSpan.style.display = 'none';
            }
            if(input && input.removeAttribute) input.removeAttribute('aria-invalid');
        }

        document.getElementById('nickname').addEventListener('input', () => clearInputError(document.getElementById('nickname'), 'nickname-error'));
        document.getElementById('age').addEventListener('input', () => clearInputError(document.getElementById('age'), 'age-error'));

        document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await submitOnboarding();
        });

        async function submitOnboarding(isRetry = false) {
            const submitBtn   = document.getElementById('submitBtn');
            const statusDiv   = document.getElementById('statusMessage');
            const nicknameInput = document.getElementById('nickname');
            const ageInput      = document.getElementById('age');
            const nicknameVal = nicknameInput.value.trim();
            const ageVal      = parseInt(ageInput.value);

            statusDiv.className = 'alert-message';
            statusDiv.textContent = '';
            
            clearInputError(nicknameInput, 'nickname-error');
            clearInputError(ageInput, 'age-error');
            clearInputError(null, 'time-error');

            let hasError = false;

            if (!nicknameVal) {
                showInputError(nicknameInput, 'nickname-error', 'Please enter your name or nickname.');
                nicknameInput.focus();
                hasError = true;
            }
            if (!ageVal || ageVal < 1 || ageVal > 120) {
                showInputError(ageInput, 'age-error', 'Please enter a valid age.');
                if(!hasError) ageInput.focus();
                hasError = true;
            }
            if (!selectedDailyTime) {
                showInputError(null, 'time-error', 'Please select a daily study time goal.');
                if(!hasError) document.querySelector('.time-option').focus();
                hasError = true;
            }

            if(hasError) return;

            submitBtn.disabled = true;
            submitBtn.setAttribute('aria-busy', 'true');
            submitBtn.textContent = isRetry ? 'Retrying…' : 'Saving…';

            try {
                await updateProfile({
                    nickname: nicknameVal,
                    age: ageVal,
                    daily_time: selectedDailyTime
                });
                window.location.href = 'levels.html';
            } catch (error) {
                showStatus('Error saving profile: ' + (error.message || 'Please try again.'), 'error', true);
                submitBtn.disabled = false;
                submitBtn.removeAttribute('aria-busy');
                submitBtn.textContent = 'CONTINUE';
            }
        }

        function showStatus(message, type, showRetry = false) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.innerHTML = '';
            statusDiv.className = `alert-message alert-${type}`;
            statusDiv.style.display = 'flex';
            statusDiv.style.flexDirection = 'column';
            statusDiv.style.alignItems = 'center';
            statusDiv.style.gap = '8px';

            const txt = document.createElement('span');
            txt.textContent = message;
            statusDiv.appendChild(txt);

            if (showRetry) {
                const retryBtn = document.createElement('button');
                retryBtn.type = 'button';
                retryBtn.className = 'btn btn-secondary';
                retryBtn.textContent = 'Retry Save';
                retryBtn.onclick = () => { statusDiv.style.display = 'none'; submitOnboarding(true); };
                retryBtn.style.padding = '4px 12px';
                retryBtn.style.minHeight = '32px';
                retryBtn.style.width = 'auto';
                retryBtn.style.marginTop = '4px';
                statusDiv.appendChild(retryBtn);
            }
        }
    </script>
</body>
</html>
