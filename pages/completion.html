<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimi - Level Completed!</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .completion-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: var(--spacing-xl);
        }

        .celebration-icon {
            font-size: 5rem;
            color: var(--primary-color);
            margin-bottom: var(--spacing-lg);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        .completion-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-color);
            margin-bottom: var(--spacing-xs);
            line-height: 1.2;
        }

        .completion-subtitle {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: var(--spacing-xl);
        }

        /* Summary Card */
        .summary-card {
            width: 100%;
            background-color: #FFF9F0;
            border: 2px solid var(--primary-color);
            border-radius: 24px;
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
            box-shadow: 0 8px 0px #FFE0B2;
        }

        .summary-stat {
            font-size: 1.2rem;
            margin-bottom: var(--spacing-sm);
            color: var(--text-color);
        }

        .summary-stat b {
            color: var(--text-color);
        }

        .motivational-msg {
            margin-top: var(--spacing-md);
            font-weight: 600;
            color: var(--text-muted);
            font-style: italic;
        }

        .actions-section {
            width: 100%;
            margin-top: auto;
            padding-bottom: var(--spacing-xl);
        }

        .btn-exit {
            background-color: #EEEEEE;
            color: var(--text-color);
            border: none;
            box-shadow: 0 4px 0px #CCCCCC;
        }

        .btn-exit:hover {
            background-color: #E0E0E0;
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <div class="completion-container">
            <div class="celebration-icon">
                <i class="fas fa-trophy"></i>
            </div>
            
            <h1 class="completion-title" id="completionTitle">Well done!</h1>
            <h2 class="completion-subtitle">Level completed</h2>

            <div class="summary-card">
                <p class="summary-stat"><b>Correct:</b> <span id="statCorrect">0</span></p>
                <p class="summary-stat"><b>Incorrect:</b> <span id="statIncorrect">0</span></p>
                <p class="summary-stat" style="color: var(--primary-color); margin-top: 10px; font-size: 1.4rem;"><b>+ <span id="statXP">0</span> XP</b></p>
                <p class="motivational-msg" id="motivationalMsg">"Keep it up, you're on the right track"</p>
            </div>

            <div class="actions-section">
                <a href="levels.html" class="btn btn-primary">CONTINUE TO NEXT LEVEL</a>
                <a href="levels.html" class="btn btn-exit" style="margin-top: var(--spacing-md);">EXIT</a>
            </div>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/profile.js"></script>

    <script>
        async function initCompletion() {
            const urlParams = new URLSearchParams(window.location.search);
            const correct = urlParams.get('correct') || 0;
            const incorrect = urlParams.get('incorrect') || 0;
            const xp = urlParams.get('xp') || 0;

            document.getElementById('statCorrect').innerText = correct;
            document.getElementById('statIncorrect').innerText = incorrect;
            document.getElementById('statXP').innerText = xp;

            const profile = await getProfile();
            if (profile) {
                const name = profile.nickname || '';
                document.getElementById('completionTitle').innerText = `Well done ${name}!`;
            }

            // Simple motivational logic
            const msg = document.getElementById('motivationalMsg');
            if (incorrect == 0) {
                msg.innerText = '"Perfect score! You are a natural!"';
            } else if (correct > incorrect) {
                msg.innerText = '"Great job! Keep practicing to get even better."';
            } else {
                msg.innerText = '"Practice makes perfect. Don\'t give up!"';
            }
        }

        initCompletion();
    </script>
</body>
</html>
