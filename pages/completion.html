<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- WCAG 2.4.2 — Descriptive page title -->
    <title>Shimi – Level Completed!</title>
    <meta name="description" content="Congratulations! You completed a lesson. Review your score and continue learning.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .completion-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: var(--spacing-xl);
        }

        /* WCAG 2.3.3 — bounce respects prefers-reduced-motion (global CSS handles it) */
        .celebration-icon {
            font-size: 5rem;
            color: var(--primary-color);
            margin-bottom: var(--spacing-lg);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40%  { transform: translateY(-20px); }
            60%  { transform: translateY(-10px); }
        }

        .completion-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-color);
            margin-bottom: var(--spacing-xs);
            line-height: 1.2;
        }

        .completion-subtitle {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: var(--spacing-xl);
        }

        .summary-card {
            width: 100%;
            background-color: #FFF9F0;
            border: 2px solid var(--primary-color);
            border-radius: 24px;
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
            box-shadow: 0 8px 0px #FFE0B2;
        }

        .summary-stat {
            font-size: 1.2rem;
            margin-bottom: var(--spacing-sm);
            color: var(--text-color);
        }

        /* WCAG 1.4.3 — XP text needs enough contrast on #FFF9F0 bg */
        .xp-stat {
            color: #9C6A00;   /* Darker than primary for contrast */
            margin-top: 10px;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .motivational-msg {
            margin-top: var(--spacing-md);
            font-weight: 600;
            color: var(--text-muted);
            font-style: italic;
        }

        .actions-section {
            width: 100%;
            margin-top: auto;
            padding-bottom: var(--spacing-xl);
        }

        .btn-exit {
            background-color: #EEEEEE;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 0px #CACFD2;
        }

        .btn-exit:hover {
            background-color: #E0E0E0;
        }
    </style>
</head>
<body>
    <!-- WCAG 2.4.1 — Skip link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="container fade-in">
        <main id="main-content">
            <div class="completion-container">
                <!-- WCAG 1.1.1 — decorative trophy icon; the heading conveys the meaning -->
                <div class="celebration-icon" aria-hidden="true">
                    <i class="fas fa-trophy"></i>
                </div>

                <!-- WCAG 1.3.1 — h1 is the primary heading; populated by JS -->
                <h1 class="completion-title" id="completionTitle" aria-live="polite">Well done!</h1>
                <p class="completion-subtitle">Level completed</p>

                <!-- WCAG 1.3.1 — summary table-like structure with semantic bold labels -->
                <div class="summary-card" role="region" aria-label="Lesson summary">
                    <p class="summary-stat">
                        <strong>Correct:</strong>
                        <span id="statCorrect">0</span>
                    </p>
                    <p class="summary-stat">
                        <strong>Incorrect:</strong>
                        <span id="statIncorrect">0</span>
                    </p>
                    <p class="xp-stat" aria-label="XP earned">
                        <strong>+ <span id="statXP">0</span> XP</strong>
                    </p>
                    <!-- aria-live so the motivational message is announced when set -->
                    <p class="motivational-msg"
                       id="motivationalMsg"
                       aria-live="polite">"Keep it up, you're on the right track"</p>
                </div>

                <div class="actions-section">
                    <!-- WCAG 2.4.4 — descriptive link text -->
                    <a href="levels.html" class="btn btn-primary">
                        CONTINUE TO NEXT LEVEL
                    </a>
                    <a href="levels.html"
                       class="btn btn-exit"
                       style="margin-top: var(--spacing-md);"
                       aria-label="Exit to lesson list">
                        EXIT
                    </a>
                </div>
            </div>
        </main>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/profile.js"></script>

    <script>
        async function initCompletion() {
            const urlParams = new URLSearchParams(window.location.search);
            const correct   = parseInt(urlParams.get('correct'))   || 0;
            const incorrect = parseInt(urlParams.get('incorrect')) || 0;
            const xp        = parseInt(urlParams.get('xp'))        || 0;

            document.getElementById('statCorrect').textContent   = correct;
            document.getElementById('statIncorrect').textContent = incorrect;
            document.getElementById('statXP').textContent        = xp;

            // Personalise title with user name
            const profile = await getProfile();
            if (profile && profile.nickname) {
                document.getElementById('completionTitle').textContent =
                    `Well done, ${profile.nickname}!`;
            }

            // Motivational message (also announced via aria-live)
            const msg = document.getElementById('motivationalMsg');
            if (incorrect === 0) {
                msg.textContent = '"Perfect score! You are a natural!"';
            } else if (correct > incorrect) {
                msg.textContent = '"Great job! Keep practising to get even better."';
            } else {
                msg.textContent = '"Practice makes perfect. Don\'t give up!"';
            }
        }

        initCompletion();
    </script>
</body>
</html>
