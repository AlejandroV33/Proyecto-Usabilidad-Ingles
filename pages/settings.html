<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- WCAG 2.4.2 — Descriptive page title -->
    <title>Shimi – Settings</title>
    <meta name="description" content="Update your Shimi profile: name, age and daily study time.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .settings-header {
            display: flex;
            align-items: center;
            padding-top: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .settings-title-section {
            text-align: center;
            margin-bottom: var(--spacing-lg);
        }

        .settings-title-section h1 {
            font-size: 1.8rem;
            margin-bottom: var(--spacing-xs);
        }

        .divider {
            height: 2px;
            background-color: #E0E0E0;
            width: 100%;
            margin: var(--spacing-md) 0;
            border-radius: 2px;
        }

        /* WCAG 1.4.3 — warning box contrast on #FFF3CD background */
        .warning-box {
            background-color: #FFF3CD;
            border: 1px solid #FFEEBA;
            color: #5C4200;  /* Darkened from #856404 for better contrast */
            padding: var(--spacing-md);
            border-radius: var(--radius);
            font-size: 0.9rem;
            margin-bottom: var(--spacing-xl);
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            color: var(--text-color);
        }

        .section-label i {
            color: var(--primary-color);
            width: 20px;
            text-align: center;
        }

        .subtext {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: var(--spacing-sm);
        }

        /* Time Grid — WCAG 2.1.1: <button> elements */
        .time-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        @media (max-width: 340px) {
            .time-grid { grid-template-columns: 1fr; }
        }

        /* WCAG 1.4.1 — selected uses border + background, not color alone */
        .time-option {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            padding: var(--spacing-md);
            font-weight: 700;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            box-shadow: 0 4px 0px #CACFD2;
            min-height: 44px;
        }

        .time-option:hover {
            border-color: var(--primary-color);
            background-color: #FFF9F0;
        }

        .time-option[aria-pressed="true"],
        .time-option.selected {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 4px 0px #e6952d;
        }

        form {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-content {
            flex: 1;
        }

        .btn-save {
            margin-top: auto;
            margin-bottom: var(--spacing-xl);
        }
    </style>
</head>
<body>
    <!-- WCAG 2.4.1 — Skip link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="container fade-in">
        <header class="settings-header" role="banner">
            <!-- WCAG 2.4.4, 1.1.1 — icon-only close button with aria-label -->
            <a href="levels.html"
               class="icon-btn"
               aria-label="Close settings and return to lessons">
                <i class="fas fa-times" aria-hidden="true"></i>
            </a>
        </header>

        <div class="settings-title-section">
            <!-- WCAG 1.3.1 — h1 as primary heading -->
            <h1>Settings</h1>
            <div class="divider" role="presentation"></div>
        </div>

        <!-- WCAG 1.3.1 — warning uses icon + text, not color alone -->
        <div class="warning-box" role="note" aria-label="Settings warning">
            <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
            <p>Remember that changing your data may slightly modify your learning experience.</p>
        </div>

        <main id="main-content">
            <form id="settingsForm" novalidate>
                <div class="form-content">

                    <!-- WCAG 1.3.1, 1.3.5 — label bound to input -->
                    <div class="input-group">
                        <label for="nickname">
                            <span class="section-label">
                                <i class="fas fa-user" aria-hidden="true"></i>
                                Name or nickname
                            </span>
                        </label>
                        <input type="text"
                               id="nickname"
                               name="name"
                               autocomplete="name"
                               placeholder="Your name"
                               required
                               aria-required="true">
                    </div>

                    <div class="input-group">
                        <label for="age">
                            <span class="section-label">
                                <i class="fas fa-calendar-alt" aria-hidden="true"></i>
                                Age
                            </span>
                        </label>
                        <input type="number"
                               id="age"
                               name="age"
                               placeholder="Your age"
                               required
                               aria-required="true"
                               min="1"
                               max="120">
                    </div>

                    <!-- WCAG 1.3.1 — fieldset/legend groups the toggle buttons -->
                    <fieldset style="border: none; padding: 0; margin: 0 0 var(--spacing-md) 0;">
                        <legend>
                            <span class="section-label">
                                <i class="fas fa-clock" aria-hidden="true"></i>
                                Daily study time
                            </span>
                        </legend>
                        <p class="subtext" id="time-hint">How much time can you dedicate each day?</p>

                        <!-- WCAG 2.1.1 — buttons keyboard operable; aria-pressed for state -->
                        <div class="time-grid" role="group" aria-describedby="time-hint">
                            <button type="button"
                                    class="time-option"
                                    data-value="10 min"
                                    aria-pressed="false">
                                10 min
                            </button>
                            <button type="button"
                                    class="time-option"
                                    data-value="15 min"
                                    aria-pressed="false">
                                15 min
                            </button>
                            <button type="button"
                                    class="time-option"
                                    data-value="25 min"
                                    aria-pressed="false">
                                25 min
                            </button>
                            <button type="button"
                                    class="time-option"
                                    data-value="30 min"
                                    aria-pressed="false">
                                30 min
                            </button>
                        </div>
                    </fieldset>
                </div>

                <!-- WCAG 4.1.3 — Live status for save feedback (replaces native alert()) -->
                <div id="statusMessage"
                     class="alert-message"
                     role="alert"
                     aria-live="assertive"
                     aria-atomic="true"></div>

                <button type="submit"
                        id="saveBtn"
                        class="btn btn-primary btn-save">
                    SAVE CHANGES
                </button>
            </form>
        </main>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/profile.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        let selectedDailyTime = '';

        /* WCAG 2.1.1 — keyboard-operable time buttons with aria-pressed */
        document.querySelectorAll('.time-option').forEach(btn => {
            btn.addEventListener('click', () => selectTime(btn));
        });

        function selectTime(element) {
            document.querySelectorAll('.time-option').forEach(opt => {
                opt.classList.remove('selected');
                opt.setAttribute('aria-pressed', 'false');
            });
            element.classList.add('selected');
            element.setAttribute('aria-pressed', 'true');
            selectedDailyTime = element.dataset.value;
        }

        /* Pre-fill form with current profile data */
        async function initSettings() {
            const profile = await getProfile();
            if (profile) {
                document.getElementById('nickname').value = profile.nickname || '';
                document.getElementById('age').value      = profile.age      || '';
                selectedDailyTime = profile.daily_time || '';

                if (selectedDailyTime) {
                    document.querySelectorAll('.time-option').forEach(opt => {
                        const isSelected = opt.dataset.value === selectedDailyTime;
                        opt.classList.toggle('selected', isSelected);
                        opt.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
                    });
                }
            }
        }

        /* Form submit — replaces native alert() with inline feedback */
        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const saveBtn    = document.getElementById('saveBtn');
            const statusDiv  = document.getElementById('statusMessage');
            const nicknameVal = document.getElementById('nickname').value.trim();
            const ageVal      = parseInt(document.getElementById('age').value);

            statusDiv.className = 'alert-message';
            statusDiv.textContent = '';

            if (!nicknameVal) {
                showStatus('Please enter your name or nickname.', 'error');
                document.getElementById('nickname').focus();
                return;
            }
            if (!ageVal || ageVal < 1 || ageVal > 120) {
                showStatus('Please enter a valid age.', 'error');
                document.getElementById('age').focus();
                return;
            }
            if (!selectedDailyTime) {
                showStatus('Please select a daily study time goal.', 'error');
                document.querySelector('.time-option').focus();
                return;
            }

            saveBtn.disabled = true;
            saveBtn.setAttribute('aria-busy', 'true');
            saveBtn.textContent = 'Saving…';

            try {
                await updateProfile({
                    nickname: nicknameVal,
                    age: ageVal,
                    daily_time: selectedDailyTime
                });
                showStatus('Settings saved successfully! Redirecting…', 'success');
                setTimeout(() => window.location.href = 'levels.html', 1500);
            } catch (error) {
                showStatus('Error updating settings: ' + (error.message || 'Please try again.'), 'error');
                saveBtn.disabled = false;
                saveBtn.removeAttribute('aria-busy');
                saveBtn.textContent = 'SAVE CHANGES';
            }
        });

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `alert-message alert-${type}`;
        }

        initSettings();
    </script>
</body>
</html>
