<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- WCAG 2.4.2 — Descriptive page title -->
    <title>Shimi – Settings</title>
    <meta name="description" content="Update your Shimi profile: name, age and daily study time.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .settings-header {
            display: flex;
            align-items: center;
            padding-top: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .settings-title-section {
            text-align: center;
            margin-bottom: var(--spacing-lg);
        }

        .settings-title-section h1 {
            font-size: 1.8rem;
            margin-bottom: var(--spacing-xs);
        }

        .divider {
            height: 2px;
            background-color: #E0E0E0;
            width: 100%;
            margin: var(--spacing-md) 0;
            border-radius: 2px;
        }

        /* WCAG 1.4.3 — warning box contrast on #FFF3CD background */
        .warning-box {
            background-color: #FFF3CD;
            border: 1px solid #FFEEBA;
            color: #5C4200;  /* Darkened from #856404 for better contrast */
            padding: var(--spacing-md);
            border-radius: var(--radius);
            font-size: 0.9rem;
            margin-bottom: var(--spacing-xl);
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            color: var(--text-color);
        }

        .section-label i {
            color: var(--primary-color);
            width: 20px;
            text-align: center;
        }

        .subtext {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: var(--spacing-sm);
        }

        /* Time Grid — WCAG 2.1.1: <button> elements */
        .time-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        @media (max-width: 340px) {
            .time-grid { grid-template-columns: 1fr; }
        }

        /* WCAG 1.4.1 — selected uses border + background, not color alone */
        .time-option {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            padding: var(--spacing-md);
            font-weight: 700;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            box-shadow: 0 4px 0px #CACFD2;
            min-height: 44px;
        }

        .time-option:hover {
            border-color: var(--primary-color);
            background-color: #FFF9F0;
        }

        .time-option[aria-pressed="true"],
        .time-option.selected {
            background-color: var(--primary-color);
            color: #2D3436;   /* AA fix: texto oscuro sobre naranja (antes 1.78:1) */
            border-color: var(--primary-color);
            box-shadow: 0 4px 0px #e6952d;
        }

        form {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-content {
            flex: 1;
        }

        .btn-save {
            margin-top: auto;
            margin-bottom: var(--spacing-xl);
        }

        /* ── Timer toggle switch ── */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-md);
            padding: var(--spacing-md) 0;
            border-top: 1px solid #EBEBEB;
            margin-top: var(--spacing-sm);
        }

        .toggle-label-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .toggle-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .toggle-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* WCAG 2.1.1 — custom toggle is a <button role="switch"> */
        .toggle-switch {
            position: relative;
            width: 52px;
            height: 28px;
            flex-shrink: 0;
            border: none;
            border-radius: 14px;
            background: #CCCCCC;
            cursor: pointer;
            transition: background 0.25s ease;
            padding: 0;
            font-family: inherit;
        }

        .toggle-switch[aria-checked="true"] {
            background: var(--primary-color);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.25);
            transition: transform 0.25s ease;
        }

        .toggle-switch[aria-checked="true"]::after {
            transform: translateX(24px);
        }
    </style>
</head>
<body>
    <!-- WCAG 2.4.1 — Skip link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="container fade-in">
        <header class="settings-header" role="banner">
            <!-- WCAG 2.4.4, 1.1.1 — icon-only close button with aria-label -->
            <a href="levels.html"
               class="icon-btn"
               aria-label="Close settings and return to lessons">
                <i class="fas fa-times" aria-hidden="true"></i>
            </a>
        </header>

        <div class="settings-title-section">
            <!-- WCAG 1.3.1 — h1 as primary heading -->
            <h1>Settings</h1>
            <div class="divider" role="presentation"></div>
        </div>

        <!-- WCAG 1.3.1 — warning uses icon + text, not color alone -->
        <div class="warning-box" role="note" aria-label="Settings warning">
            <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
            <p>Remember that changing your data may slightly modify your learning experience.</p>
        </div>

        <main id="main-content" tabindex="-1">
            <form id="settingsForm" novalidate>
                <div class="form-content">

                    <!-- WCAG 1.3.1, 1.3.5 — label bound to input -->
                    <div class="input-group">
                        <label for="nickname">
                            <span class="section-label">
                                <i class="fas fa-user" aria-hidden="true"></i>
                                Name or nickname<span class="required-asterisk">*</span>
                            </span>
                        </label>
                        <input type="text"
                               id="nickname"
                               name="name"
                               autocomplete="name"
                               placeholder="Your name"
                               required
                               aria-required="true">
                        <span id="nickname-error" class="password-hint" style="color: var(--error-color); display: none;"></span>
                    </div>

                    <div class="input-group">
                        <label for="age">
                            <span class="section-label">
                                <i class="fas fa-calendar-alt" aria-hidden="true"></i>
                                Age<span class="required-asterisk">*</span>
                            </span>
                        </label>
                        <input type="number"
                               id="age"
                               name="age"
                               placeholder="Your age"
                               required
                               aria-required="true"
                               min="1"
                               max="120">
                        <span id="age-error" class="password-hint" style="color: var(--error-color); display: none;"></span>
                    </div>

                    <!-- WCAG 1.3.1 — fieldset/legend groups the toggle buttons -->
                    <fieldset style="border: none; padding: 0; margin: 0 0 var(--spacing-md) 0;">
                        <legend>
                            <span class="section-label">
                                <i class="fas fa-clock" aria-hidden="true"></i>
                                Daily study time<span class="required-asterisk">*</span>
                            </span>
                        </legend>
                        <p class="subtext" id="time-hint">How much time can you dedicate each day?</p>

                        <!-- WCAG 2.1.1 — buttons keyboard operable; aria-pressed for state -->
                        <div class="time-grid" role="group" aria-describedby="time-hint">
                            <button type="button"
                                    class="time-option"
                                    data-value="10 min"
                                    aria-pressed="false">
                                10 min
                            </button>
                            <button type="button"
                                    class="time-option"
                                    data-value="15 min"
                                    aria-pressed="false">
                                15 min
                            </button>
                            <button type="button"
                                    class="time-option"
                                    data-value="25 min"
                                    aria-pressed="false">
                                25 min
                            </button>
                            <button type="button"
                                    class="time-option"
                                    data-value="30 min"
                                    aria-pressed="false">
                                30 min
                            </button>
                        </div>
                        <span id="time-error" class="password-hint" style="color: var(--error-color); display: none;"></span>
                    </fieldset>

                    <!-- ── Timer toggle — WCAG 2.2.1 user control over time limits ── -->
                    <fieldset style="border: none; padding: 0; margin: 0;">
                        <legend class="sr-only">Exercise timer setting</legend>

                        <div class="toggle-row">
                            <div class="toggle-label-group">
                                <span class="toggle-title" id="timer-toggle-label">
                                    <i class="fas fa-hourglass-half" aria-hidden="true"
                                       style="color: var(--primary-color);"></i>
                                    Exercise countdown timer
                                </span>
                                <span class="toggle-desc" id="timer-toggle-desc">
                                    1 min 40 s per level. You can always retry if you run out.
                                </span>
                            </div>

                            <!-- WCAG 2.1.1 — role="switch" for toggle semantics -->
                            <button type="button"
                                    id="timerToggle"
                                    class="toggle-switch"
                                    role="switch"
                                    aria-checked="true"
                                    aria-labelledby="timer-toggle-label"
                                    aria-describedby="timer-toggle-desc">
                                <span class="sr-only" id="timer-toggle-state">Enabled</span>
                            </button>
                        </div>
                    </fieldset>
                </div>

                <!-- WCAG 4.1.3 — Live status for save feedback (replaces native alert()) -->
                <div id="statusMessage"
                     class="alert-message"
                     role="alert"
                     aria-live="assertive"
                     aria-atomic="true"></div>

                <button type="submit"
                        id="saveBtn"
                        class="btn btn-primary btn-save">
                    SAVE CHANGES
                </button>

                <button type="button"
                        id="signOutBtn"
                        class="btn btn-secondary btn-save"
                        style="background-color: #C62828; color: white; border: none; margin-bottom: var(--spacing-xl);"
                        onclick="signOut()">
                    SIGN OUT
                </button>
            </form>
        </main>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/profile.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        let selectedDailyTime = '';

        /* WCAG 2.1.1 — keyboard-operable time buttons with aria-pressed */
        document.querySelectorAll('.time-option').forEach(btn => {
            btn.addEventListener('click', () => selectTime(btn));
        });

        function selectTime(element) {
            document.querySelectorAll('.time-option').forEach(opt => {
                opt.classList.remove('selected');
                opt.setAttribute('aria-pressed', 'false');
            });
            element.classList.add('selected');
            element.setAttribute('aria-pressed', 'true');
            selectedDailyTime = element.dataset.value;
        }

        /* Pre-fill form with current profile data */
        async function initSettings() {
            const profile = await getProfile();
            if (profile) {
                document.getElementById('nickname').value = profile.nickname || '';
                document.getElementById('age').value      = profile.age      || '';
                selectedDailyTime = profile.daily_time || '';

                if (selectedDailyTime) {
                    document.querySelectorAll('.time-option').forEach(opt => {
                        const isSelected = opt.dataset.value === selectedDailyTime;
                        opt.classList.toggle('selected', isSelected);
                        opt.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
                    });
                }

                // Pre-set the timer toggle (default true if field missing)
                const timerOn = (profile.timer_enabled !== false);
                setToggle(timerOn);
            }
        }

        // Validation logic
        function showInputError(input, errorId, message) {
            const errorSpan = document.getElementById(errorId);
            if(errorSpan) {
                errorSpan.textContent = message;
                errorSpan.style.display = 'block';
            }
            if(input && input.setAttribute) input.setAttribute('aria-invalid', 'true');
        }

        function clearInputError(input, errorId) {
            const errorSpan = document.getElementById(errorId);
            if(errorSpan) {
                errorSpan.textContent = '';
                errorSpan.style.display = 'none';
            }
            if(input && input.removeAttribute) input.removeAttribute('aria-invalid');
        }

        document.getElementById('nickname').addEventListener('input', () => clearInputError(document.getElementById('nickname'), 'nickname-error'));
        document.getElementById('age').addEventListener('input', () => clearInputError(document.getElementById('age'), 'age-error'));

        /* Form submit — replaces native alert() with inline feedback */
        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await saveSettings();
        });

        async function saveSettings(isRetry = false) {
            const saveBtn    = document.getElementById('saveBtn');
            const statusDiv  = document.getElementById('statusMessage');
            const nicknameInput = document.getElementById('nickname');
            const ageInput      = document.getElementById('age');
            const nicknameVal = nicknameInput.value.trim();
            const ageVal      = parseInt(ageInput.value);

            statusDiv.className = 'alert-message';
            statusDiv.textContent = '';
            
            clearInputError(nicknameInput, 'nickname-error');
            clearInputError(ageInput, 'age-error');
            clearInputError(null, 'time-error');

            let hasError = false;

            if (!nicknameVal) {
                showInputError(nicknameInput, 'nickname-error', 'Please enter your name or nickname.');
                nicknameInput.focus();
                hasError = true;
            }
            if (!ageVal || ageVal < 1 || ageVal > 120) {
                showInputError(ageInput, 'age-error', 'Please enter a valid age.');
                if(!hasError) ageInput.focus();
                hasError = true;
            }
            if (!selectedDailyTime) {
                showInputError(null, 'time-error', 'Please select a daily study time goal.');
                if(!hasError) document.querySelector('.time-option').focus();
                hasError = true;
            }

            if(hasError) return;

            saveBtn.disabled = true;
            saveBtn.setAttribute('aria-busy', 'true');
            saveBtn.textContent = isRetry ? 'Retrying…' : 'Saving…';

            try {
                await updateProfile({
                    nickname: nicknameVal,
                    age: ageVal,
                    daily_time: selectedDailyTime,
                    timer_enabled: getToggleValue()    // save timer preference
                });
                showStatus('Settings saved successfully! Redirecting…', 'success');
                setTimeout(() => window.location.href = 'levels.html', 1500);
            } catch (error) {
                showStatus('Error updating settings: ' + (error.message || 'Please try again.'), 'error', true);
                saveBtn.disabled = false;
                saveBtn.removeAttribute('aria-busy');
                saveBtn.textContent = 'SAVE CHANGES';
            }
        }

        function showStatus(message, type, showRetry = false) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.innerHTML = '';
            statusDiv.className = `alert-message alert-${type}`;
            statusDiv.style.display = 'flex';
            statusDiv.style.flexDirection = 'column';
            statusDiv.style.alignItems = 'center';
            statusDiv.style.gap = '8px';

            const txt = document.createElement('span');
            txt.textContent = message;
            statusDiv.appendChild(txt);

            if (showRetry && type === 'error') {
                const retryBtn = document.createElement('button');
                retryBtn.type = 'button';
                retryBtn.className = 'btn btn-secondary';
                retryBtn.textContent = 'Retry Save';
                retryBtn.onclick = () => { statusDiv.style.display = 'none'; saveSettings(true); };
                retryBtn.style.padding = '4px 12px';
                retryBtn.style.minHeight = '32px';
                retryBtn.style.width = 'auto';
                retryBtn.style.marginTop = '4px';
                statusDiv.appendChild(retryBtn);
            }
        }

        /* ── Timer toggle helpers ── */
        function setToggle(isOn) {
            const btn   = document.getElementById('timerToggle');
            const label = document.getElementById('timer-toggle-state');
            btn.setAttribute('aria-checked', isOn ? 'true' : 'false');
            label.textContent = isOn ? 'Enabled' : 'Disabled';
        }

        function getToggleValue() {
            return document.getElementById('timerToggle').getAttribute('aria-checked') === 'true';
        }

        // WCAG 2.1.1 — Space and Enter both activate the switch
        document.getElementById('timerToggle').addEventListener('click', () => {
            const current = getToggleValue();
            setToggle(!current);
        });

        initSettings();
    </script>
</body>
</html>
