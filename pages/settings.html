<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimi - Settings</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .settings-header {
            display: flex;
            align-items: center;
            padding-top: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .close-btn {
            color: var(--text-muted);
            text-decoration: none;
            padding: var(--spacing-sm);
            font-weight: 800;
        }

        .settings-title-section {
            text-align: center;
            margin-bottom: var(--spacing-lg);
        }

        .settings-title-section h1 {
            font-size: 1.8rem;
            margin-bottom: var(--spacing-xs);
        }

        .divider {
            height: 2px;
            background-color: #E0E0E0;
            width: 100%;
            margin: var(--spacing-md) 0;
            border-radius: 2px;
        }

        .warning-box {
            background-color: #FFF3CD;
            border: 1px solid #FFEEBA;
            color: #856404;
            padding: var(--spacing-md);
            border-radius: var(--radius);
            font-size: 0.9rem;
            margin-bottom: var(--spacing-xl);
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .warning-box i {
            margin-top: 3px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            color: var(--text-color);
        }

        .section-title i {
            color: var(--primary-color);
            width: 20px;
            text-align: center;
        }

        .subtext {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: var(--spacing-sm);
        }

        /* Time Grid */
        .time-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .time-option {
            background: white;
            border: 2px solid #E0E0E0;
            border-radius: var(--radius);
            padding: var(--spacing-md);
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            box-shadow: 0 4px 0px #E0E0E0;
            font: inherit;
        }

        .time-option:hover {
            border-color: var(--primary-color);
            background-color: #FFF9F0;
        }

        .time-option.selected {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 4px 0px #e6952d;
        }

        form {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-content {
            flex: 1;
        }

        .btn-save {
            margin-top: auto;
            margin-bottom: var(--spacing-xl);
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <!-- Cabecera -->
        <header class="settings-header">
            <a href="dashboard.html" class="close-btn" data-i18n="backHome">Back home</a>
        </header>

        <div class="settings-title-section">
            <h1 data-i18n="settings">Settings</h1>
            <div class="divider"></div>
        </div>

        <!-- Advertencia -->
        <div class="warning-box">
            <i class="fas fa-exclamation-triangle"></i>
            <p data-i18n="settingsWarning">Changing your preferences can slightly adjust your learning path.</p>
        </div>

        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
            <div class="form-content">
                <!-- Nombre -->
                <div class="input-group">
                    <div class="section-title">
                        <i class="fas fa-user"></i>
                        <span data-i18n="nickname">Name or nickname</span>
                    </div>
                    <input type="text" id="nickname" value="Alejo" required>
                </div>

                <!-- Edad -->
                <div class="input-group">
                    <div class="section-title">
                        <i class="fas fa-calendar-alt"></i>
                        <span data-i18n="age">Age</span>
                    </div>
                    <input type="number" id="age" value="22" required min="1">
                </div>

                <!-- Tiempo Diario -->
                <div class="input-group">
                    <div class="section-title">
                        <i class="fas fa-clock"></i>
                        <span data-i18n="dailyTime">Daily time</span>
                    </div>
                    <p class="subtext" data-i18n="dailyTimeQuestion">How much time can you practice each day?</p>
                    
                    <div class="time-grid">
                        <button type="button" class="time-option">5 min</button>
                        <button type="button" class="time-option selected">10 min</button>
                        <button type="button" class="time-option">15 min</button>
                        <button type="button" class="time-option">+20 min</button>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-save" data-i18n="saveBackHome">Save and go home</button>
        </form>
    </div>

    <script src="../js/i18n.js"></script>
    <script>
        document.querySelectorAll('.time-option').forEach((option) => {
            option.addEventListener('click', () => selectTime(option));
        });

        function selectTime(element) {
            document.querySelectorAll('.time-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
        }
    </script>
</body>
</html>
