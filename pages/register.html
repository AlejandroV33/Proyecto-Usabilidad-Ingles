<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Shimi</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .error-message {
            color: var(--error-color);
            font-size: 0.9rem;
            margin-top: var(--spacing-sm);
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <div class="header">
            <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h2>Create your account</h2>
        </div>

        <form id="registerForm">
            <div class="input-group">
                <label for="nickname">Name</label>
                <input type="text" id="nickname" placeholder="Your name" required>
            </div>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@email.com" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimum 8 characters" required minlength="8">
            </div>
            
            <div id="errorMessage" class="error-message"></div>
            <button type="submit" id="submitBtn" class="btn btn-primary" style="margin-top: var(--spacing-lg);">REGISTER</button>
        </form>

        <div style="text-align: center; margin-top: var(--spacing-xl);">
            <p style="color: var(--text-muted);">Already have an account? <a href="login.html" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Log In</a></p>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            
            const nickname = document.getElementById('nickname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.innerText = 'CREATING ACCOUNT...';
            errorDiv.style.display = 'none';

            try {
                const result = await signUp(email, password, nickname);

                if (result.session) {
                    // Email confirmation not required — session is active, go to onboarding
                    window.location.href = 'onboarding.html';
                } else {
                    // Email confirmation required — show inline message, don't redirect
                    errorDiv.style.color = 'var(--success-color)';
                    errorDiv.style.border = '1px solid var(--success-color)';
                    errorDiv.style.background = '#F0FFF8';
                    errorDiv.style.borderRadius = 'var(--radius)';
                    errorDiv.style.padding = 'var(--spacing-md)';
                    errorDiv.innerHTML = '<i class="fas fa-check-circle"></i> Account created! Please check your email to verify your account, then <a href="login.html" style="color: var(--success-color); font-weight: 700;">log in here</a>.';
                    errorDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'REGISTER';
                }
            } catch (error) {
                errorDiv.innerText = error.message;
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'REGISTER';
            }
        });
    </script>
</body>
</html>
