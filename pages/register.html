<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Shimi</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .header {
            display: flex;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            padding-top: var(--spacing-md);
        }
        .back-btn {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-right: var(--spacing-md);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <div class="header">
            <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h2>Create your account</h2>
        </div>

        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Your name" required>
            </div>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@email.com" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimum 8 characters" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="margin-top: var(--spacing-lg);">REGISTER</button>
        </form>

        <div style="text-align: center; margin-top: var(--spacing-xl);">
            <p style="color: var(--text-muted);">Already have an account? <a href="login.html" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Log In</a></p>
        </div>
    </div>
</body>
</html>
