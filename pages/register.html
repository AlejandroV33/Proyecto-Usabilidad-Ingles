<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Shimi</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .header {
            display: flex;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            padding-top: var(--spacing-md);
        }
        .back-btn {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-right: var(--spacing-md);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <div class="header">
            <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h2>Crea tu cuenta</h2>
        </div>

        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
            <div class="input-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" placeholder="Tu nombre" required>
            </div>
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="margin-top: var(--spacing-lg);">REGISTRARME</button>
        </form>

        <div style="text-align: center; margin-top: var(--spacing-xl);">
            <p style="color: var(--text-muted);">¿Ya tienes cuenta? <a href="login.html" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Inicia Sesión</a></p>
        </div>
    </div>
</body>
</html>
