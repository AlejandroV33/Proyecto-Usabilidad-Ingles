<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- WCAG 2.4.2 — Descriptive page title -->
    <title>Shimi – Log In to Your Account</title>
    <meta name="description" content="Log in to Shimi and continue learning English B1.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .page-header {
            display: flex;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            padding-top: var(--spacing-md);
            gap: var(--spacing-sm);
        }
    </style>
</head>
<body>
    <!-- WCAG 2.4.1 — Skip link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="container fade-in">
        <!-- WCAG 2.4.4 — Back button with aria-label (icon-only) -->
        <header class="page-header" role="banner">
            <a href="../index.html"
               class="icon-btn"
               aria-label="Back to home">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
            </a>
            <!-- WCAG 1.3.1 — h1 for main heading of the page -->
            <h1 style="font-size: 1.5rem; margin-bottom: 0;">Log In</h1>
        </header>

        <main id="main-content" tabindex="-1">
            <!-- WCAG 1.3.1, 1.3.5 — form with proper labels and autocomplete -->
            <form id="loginForm" novalidate>
                <div class="input-group">
                    <label for="email">Email address<span class="required-asterisk">*</span></label>
                    <input type="email"
                           id="email"
                           name="email"
                           autocomplete="email"
                           placeholder="you@email.com"
                           required
                           aria-required="true"
                           aria-describedby="email-hint">
                    <span id="email-hint" class="sr-only">Enter the email address you used to register.</span>
                    <span id="email-error" class="password-hint" style="color: var(--error-color); display: none;"></span>
                </div>

                <div class="input-group">
                    <label for="password">Password<span class="required-asterisk">*</span></label>
                    <input type="password"
                           id="password"
                           name="password"
                           autocomplete="current-password"
                           placeholder="••••••••"
                           required
                           aria-required="true">
                    <span id="password-error" class="password-hint" style="color: var(--error-color); display: none;"></span>
                </div>

                <!-- WCAG 4.1.3 — Live region for dynamic errors (role="alert" announces on change) -->
                <div id="errorMessage"
                     class="alert-message"
                     role="alert"
                     aria-live="assertive"
                     aria-atomic="true"></div>

                <div id="forgotPasswordSuggestion" style="display: none; text-align: center; margin-top: var(--spacing-sm);">
                    <a href="#" style="color: var(--primary-text); font-weight: 600; font-size: 0.9rem; text-decoration: underline;">Trouble logging in? Reset your password</a>
                </div>

                <button type="submit"
                        id="submitBtn"
                        class="btn btn-primary"
                        style="margin-top: var(--spacing-lg);">
                    LOG IN
                </button>
            </form>

            <p style="text-align: center; margin-top: var(--spacing-xl); color: var(--text-muted);">
                Don't have an account?
                <!-- WCAG 2.4.4 — Descriptive link text -->
                <a href="register.html"
                   style="color: var(--primary-text); font-weight: 600; text-decoration: underline;">
                    Sign up for free
                </a>
            </p>
        </main>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorDiv  = document.getElementById('errorMessage');
        const emailInput    = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        let loginFailCount = 0;

        function showInputError(input, errorId, message) {
            const errorSpan = document.getElementById(errorId);
            if(errorSpan) {
                errorSpan.textContent = message;
                errorSpan.style.display = 'block';
            }
            if(input) input.setAttribute('aria-invalid', 'true');
        }

        function clearInputError(input, errorId) {
            const errorSpan = document.getElementById(errorId);
            if(errorSpan) {
                errorSpan.textContent = '';
                errorSpan.style.display = 'none';
            }
            if(input) input.removeAttribute('aria-invalid');
        }

        emailInput.addEventListener('input', () => clearInputError(emailInput, 'email-error'));
        passwordInput.addEventListener('input', () => clearInputError(passwordInput, 'password-error'));

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Clear previous errors and invalid states
            errorDiv.className = 'alert-message';
            errorDiv.textContent = '';
            clearInputError(emailInput, 'email-error');
            clearInputError(passwordInput, 'password-error');

            const email    = emailInput.value.trim();
            const password = passwordInput.value;
            let hasError = false;

            // Basic client-side validation
            if (!email) {
                showInputError(emailInput, 'email-error', 'Please enter your email address.');
                emailInput.focus();
                hasError = true;
            }
            if (!password) {
                showInputError(passwordInput, 'password-error', 'Please enter your password.');
                if(!hasError) passwordInput.focus();
                hasError = true;
            }

            if(hasError) return;

            submitBtn.disabled = true;
            // WCAG 4.1.3 — announce loading state
            submitBtn.setAttribute('aria-busy', 'true');
            submitBtn.textContent = 'Logging in…';

            try {
                await signIn(email, password);
                window.location.href = 'levels.html';
            } catch (error) {
                loginFailCount++;
                showError(error.message || 'Login failed. Please try again.');
                
                if (loginFailCount >= 2) {
                    document.getElementById('forgotPasswordSuggestion').style.display = 'block';
                }

                submitBtn.disabled = false;
                submitBtn.removeAttribute('aria-busy');
                submitBtn.textContent = 'LOG IN';
            }
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.className = 'alert-message alert-error';
        }
    </script>
</body>
</html>
