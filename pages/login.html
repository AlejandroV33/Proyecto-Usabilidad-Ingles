<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shimi</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .header {
            display: flex;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            padding-top: var(--spacing-md);
        }
        .back-btn {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-right: var(--spacing-md);
            text-decoration: none;
        }
        .error-message {
            color: var(--error-color);
            font-size: 0.9rem;
            margin-top: var(--spacing-sm);
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <div class="header">
            <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h2>Login</h2>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@email.com" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <div id="errorMessage" class="error-message"></div>
            <button type="submit" id="submitBtn" class="btn btn-primary" style="margin-top: var(--spacing-lg);">LOGIN</button>
        </form>

        <div style="text-align: center; margin-top: var(--spacing-xl);">
            <p style="color: var(--text-muted);">Don't have an account? <a href="register.html" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Sign up</a></p>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.innerText = 'LOGGING IN...';
            errorDiv.style.display = 'none';

            try {
                await signIn(email, password);
                window.location.href = 'levels.html';
            } catch (error) {
                errorDiv.innerText = error.message;
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'LOGIN';
            }
        });
    </script>
</body>
</html>
