<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shimi</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .header {
            display: flex;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            padding-top: var(--spacing-md);
        }
        .back-btn {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-right: var(--spacing-md);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <div class="header">
            <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h2>Login</h2>
        </div>

        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@email.com" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="margin-top: var(--spacing-lg);">LOGIN</button>
        </form>

        <div style="text-align: center; margin-top: var(--spacing-xl);">
            <p style="color: var(--text-muted);">Don't have an account? <a href="register.html" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Sign up</a></p>
        </div>
        
        <!--<div style="margin-top: auto; padding-bottom: var(&#45;&#45;spacing-xl);">
            <p style="text-align: center; color: var(&#45;&#45;text-muted); margin-bottom: var(&#45;&#45;spacing-md);">Or continue with</p>
            <div style="display: flex; gap: var(&#45;&#45;spacing-md);">
                <button class="btn btn-secondary"><i class="fab fa-google" style="margin-right: 10px;"></i> Google</button>
                <button class="btn btn-secondary"><i class="fab fa-facebook" style="margin-right: 10px;"></i> Facebook</button>
            </div>
        </div>-->
    </div>
</body>
</html>
