<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Shimi</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md) 0;
            margin-bottom: var(--spacing-lg);
        }
        .user-stats {
            display: flex;
            gap: var(--spacing-md);
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 700;
        }
        .stat-item i.fa-fire { color: #FF4500; }
        .stat-item i.fa-gem { color: #4A90E2; }
        
        .lesson-path {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-xl);
            padding-bottom: 80px; /* Space for bottom nav */
        }
        
        .lesson-node {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
            box-shadow: 0 6px 0px #e6952d;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
        }
        
        .lesson-node:hover {
            transform: scale(1.05);
        }
        
        .lesson-node.locked {
            background-color: #E0E0E0;
            box-shadow: 0 6px 0px #BDBDBD;
            cursor: not-allowed;
            border: none;
        }

        .lesson-node.locked:hover {
            transform: none;
        }
        
        .lesson-label {
            margin-top: var(--spacing-xs);
            font-weight: 600;
            text-align: center;
        }
        
        .node-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .flow-note {
            background: #F8F9FA;
            border: 2px solid #E0E0E0;
            border-radius: var(--radius);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            font-weight: 700;
            color: var(--text-muted);
        }
        .flow-note strong {
            color: var(--text-color);
        }
        .choice-panel {
            display: grid;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard-header">
            <div class="user-stats">
                <div class="stat-item"><i class="fas fa-fire"></i> 5</div>
                <div class="stat-item"><i class="fas fa-gem"></i> 120</div>
            </div>
            <div class="user-profile">
                <i class="fas fa-user-circle" style="font-size: 2rem; color: var(--text-muted);"></i>
            </div>
        </div>

        <div class="flow-note">
            <strong data-i18n="chooseStart">Choose your start:</strong> <span data-i18n="chooseStartText">Take a placement test or start from A1 without a test.</span>
        </div>

        <div class="choice-panel">
            <a href="evaluation.html" class="btn btn-primary" id="dashboardDiagnostic" data-i18n="takePlacement">Take placement test</a>
            <button type="button" class="btn btn-secondary" id="dashboardStartA1" data-i18n="startA1">Start from A1</button>
        </div>

        <div class="lesson-path">
            <div class="node-wrapper fade-in">
                <a href="lesson.html" class="lesson-node">
                    <i class="fas fa-star"></i>
                </a>
                <span class="lesson-label" data-i18n="intro">Introduction</span>
            </div>

            <div class="node-wrapper fade-in" style="animation-delay: 0.1s; margin-left: 60px;">
                <a href="exercise.html" class="lesson-node">
                    <i class="fas fa-book"></i>
                </a>
                <span class="lesson-label" data-i18n="guidedPhrases">Guided phrases</span>
            </div>

            <div class="node-wrapper fade-in" style="animation-delay: 0.2s; margin-right: 40px;">
                <a href="evaluation.html" class="lesson-node locked" id="evaluationNode" aria-label="Placement available after practice">
                    <i class="fas fa-clipboard-check"></i>
                </a>
                <span class="lesson-label" id="evaluationLabel" data-i18n="placementAfterPractice">Placement test</span>
            </div>

            <div class="node-wrapper fade-in" style="animation-delay: 0.3s;">
                <button type="button" class="lesson-node locked" disabled aria-label="Trips locked">
                    <i class="fas fa-plane"></i>
                </button>
                <span class="lesson-label" data-i18n="tripsLocked">Trips</span>
            </div>
            
            <div class="node-wrapper fade-in" style="animation-delay: 0.4s; margin-left: -50px;">
                <button type="button" class="lesson-node locked" disabled aria-label="Work locked">
                    <i class="fas fa-briefcase"></i>
                </button>
                <span class="lesson-label" data-i18n="workLocked">Work</span>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item active">
                <i class="fas fa-home"></i>
                <span data-i18n="home">Home</span>
            </a>
            <a href="lesson.html" class="nav-item">
                <i class="fas fa-dumbbell"></i>
                <span data-i18n="practice">Practice</span>
            </a>
            <button type="button" class="nav-item" disabled>
                <i class="fas fa-trophy"></i>
                <span data-i18n="league">League</span>
            </button>
            <button type="button" class="nav-item" disabled>
                <i class="fas fa-store"></i>
                <span data-i18n="shop">Shop</span>
            </button>
        </nav>
    </div>

    <script src="../js/i18n.js"></script>
    <script>
        const evaluationNode = document.getElementById('evaluationNode');
        const evaluationLabel = document.getElementById('evaluationLabel');
        const startA1Btn = document.getElementById('dashboardStartA1');

        startA1Btn.addEventListener('click', () => {
            localStorage.setItem('shimiAssignedLevel', 'A1');
            localStorage.removeItem('shimiActiveModule');
            window.location.href = 'levels.html';
        });

        function updateDashboardState() {
            const currentGuidedDone = localStorage.getItem('shimiGuidedPracticeCompleted') === 'true';
            const currentLevel = localStorage.getItem('shimiAssignedLevel');

            if (currentLevel) {
                evaluationNode.href = 'levels.html';
                evaluationNode.classList.remove('locked');
                evaluationNode.setAttribute('aria-label', `Open assigned module ${currentLevel}`);
                evaluationLabel.textContent = window.ShimiI18n.t('activeModule', { level: currentLevel });
            } else if (currentGuidedDone) {
                evaluationNode.href = 'evaluation.html';
                evaluationNode.classList.remove('locked');
                evaluationNode.setAttribute('aria-label', 'Start placement test');
                evaluationLabel.textContent = window.ShimiI18n.t('placementAfterPractice');
            } else {
                evaluationNode.removeAttribute('href');
                evaluationNode.classList.add('locked');
                evaluationNode.setAttribute('aria-disabled', 'true');
                evaluationLabel.textContent = window.ShimiI18n.t('placementAfterPractice');
            }
        }

        updateDashboardState();
        document.addEventListener('DOMContentLoaded', updateDashboardState);
        window.addEventListener('shimi-language-change', updateDashboardState);
    </script>
</body>
</html>
