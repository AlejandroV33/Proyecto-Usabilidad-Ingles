<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimi - Levels</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .levels-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-md) 0;
            margin-bottom: var(--spacing-lg);
        }

        .header-section-name {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .progress-container {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: #E0E0E0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .progress-bar-fill {
            width: 90%;
            height: 100%;
            background-color: var(--success-color);
        }

        .progress-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .settings-btn {
            font-size: 1.2rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .main-title {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: var(--spacing-xl);
        }

        /* Level Grid */
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .level-item {
            aspect-ratio: 1/1;
            background: white;
            border: 2px solid #E0E0E0;
            border-radius: var(--radius);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 0px #E0E0E0;
            cursor: pointer;
        }

        .level-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #E0E0E0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 1.2rem;
        }

        /* Completed Status */
        .level-item.completed {
            border-color: var(--success-color);
            box-shadow: 0 4px 0px #00a383;
        }
        .level-item.completed .level-circle {
            border-color: var(--success-color);
            color: var(--success-color);
        }
        .check-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            color: var(--success-color);
            font-size: 0.9rem;
        }

        /* Active/Large Level */
        .level-item.active-level {
            grid-column: span 3;
            aspect-ratio: auto;
            padding: var(--spacing-md);
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: 0 6px 0px #e6952d;
            color: white;
            flex-direction: row;
            gap: var(--spacing-md);
        }

        .active-level .level-circle {
            border-color: white;
            background-color: white;
            color: var(--primary-color);
        }

        .active-level span {
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Locked Status */
        .level-item.locked {
            background-color: #F0F0F0;
            border-color: #E0E0E0;
            color: #BDBDBD;
            box-shadow: 0 4px 0px #D0D0D0;
            cursor: not-allowed;
        }
        .level-item.locked .level-circle {
            border-color: #D0D0D0;
        }

        /* Section 6 Area */
        .section-separator {
            background-color: #F8F9FA;
            border: 2px solid #E0E0E0;
            border-radius: var(--radius);
            padding: var(--spacing-md);
            margin-top: var(--spacing-xl);
        }

        .section-separator-title {
            font-weight: 800;
            margin-bottom: var(--spacing-md);
            color: var(--text-muted);
        }

        /* Navigation Footer */
        .nav-footer {
            display: flex;
            justify-content: center;
            gap: var(--spacing-lg);
            padding: var(--spacing-xl) 0;
            margin-top: auto;
        }

        .nav-circle-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #E0E0E0;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: var(--text-muted);
            box-shadow: 0 4px 0px #E0E0E0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-circle-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <!-- Cabecera Optimizada -->
        <header class="levels-header" style="align-items: flex-start; gap: var(--spacing-md);">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
                <div style="display: flex; align-items: baseline; gap: 8px;">
                    <span class="user-name" id="userNameDisplay" style="font-size: 1.2rem; font-weight: 800;">Loading...</span>
                    <div class="xp-badge" style="padding: 2px 10px; border-radius: 12px; background: #FFF3E0; border: 1px solid #FFE0B2;">
                        <i class="fas fa-bolt" style="font-size: 0.75rem; color: #E67E22;"></i>
                        <span id="userXP" style="font-size: 0.75rem; color: #E67E22; font-weight: 800;">0 XP</span>
                    </div>
                </div>
                
                <div class="progress-container" style="width: 100%; margin: 4px 0;">
                    <div class="progress-bar-bg" style="height: 8px;">
                        <div class="progress-bar-fill" style="width: 15%;"></div>
                    </div>
                    <div style="display: flex; justify-content: space-between; width: 100%;">
                        <span class="progress-text" style="font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Section 5</span>
                        <span class="progress-text" style="font-size: 0.7rem; color: var(--text-muted); font-weight: 700;">15%</span>
                    </div>
                </div>
            </div>

            <a href="settings.html" style="color: var(--text-muted); text-decoration: none; padding: 5px; font-size: 1.3rem;">
                <i class="fas fa-cog"></i>
            </a>
        </header>

        <h2 class="main-title" style="margin-top: var(--spacing-md); font-size: 1.4rem;">Select a lesson</h2>

        <!-- Contenedor Dinámico de Niveles -->
        <div id="dynamicLevelsContainer">
            <!-- Populated by JS -->
        </div>

        <!-- Footer Navegación -->
        <footer class="nav-footer">
            <div class="nav-circle-btn"><i class="fas fa-chevron-left"></i></div>
            <div class="nav-circle-btn"><i class="fas fa-chevron-right"></i></div>
        </footer>
    </div>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/profile.js"></script>

    <script src="../js/exercises.js"></script>

    <script>
        async function initLevels() {
            const profile = await getProfile();
            const levelsData = await getAllLevels();
            
            if (profile) {
                const name = profile.nickname || 'User';
                document.getElementById('userNameDisplay').innerText = name;
                document.getElementById('userXP').innerText = (profile.xp || 0) + ' XP';
                
                renderLevels(profile.completed_levels || [], levelsData);
            } else {
                window.location.href = 'login.html';
            }
        }

        function renderLevels(completedLevels, levelsData) {
            const container = document.getElementById('dynamicLevelsContainer');
            container.innerHTML = '';
            
            // Render levels from Supabase
            const grid = document.createElement('div');
            grid.className = 'levels-grid';
            
            let foundNext = false;
            
            // Use Supabase data if available, else default to 6 placeholders
            const totalLevels = Math.max(levelsData.length, 6);

            for (let i = 1; i <= totalLevels; i++) {
                const levelItem = document.createElement('div');
                const levelFromDb = levelsData.find(l => l.id === i);
                
                if (completedLevels.includes(i)) {
                    levelItem.className = 'level-item completed';
                    levelItem.innerHTML = `<i class="fas fa-check-circle check-badge"></i><div class="level-circle">${i}</div>`;
                    levelItem.onclick = () => window.location.href = `exercise.html?level=${i}`;
                } else if (!foundNext && levelFromDb) {
                    levelItem.className = 'level-item active-level';
                    levelItem.innerHTML = `<div class="level-circle">${i}</div><span>Start</span>`;
                    levelItem.onclick = () => window.location.href = `exercise.html?level=${i}`;
                    foundNext = true;
                } else {
                    levelItem.className = 'level-item locked';
                    levelItem.innerHTML = `<i class="fas fa-lock"></i>`;
                }
                grid.appendChild(levelItem);
            }
            container.appendChild(grid);
        }

        initLevels();
    </script>
</body>
</html>
