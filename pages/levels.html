<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimi - Levels</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .levels-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-md) 0;
            margin-bottom: var(--spacing-lg);
        }

        .header-section-name {
            font-weight: 800;
            font-size: 1.1rem;
        }

        .progress-container {
            flex: 0.8;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: #E0E0E0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: var(--success-color);
            transition: width 0.2s ease;
        }

        .main-title {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: var(--spacing-md);
        }

        .diagnostic-note {
            background: #F8F9FA;
            border: 2px solid #E0E0E0;
            border-radius: var(--radius);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            font-weight: 700;
            color: var(--text-muted);
        }

        .diagnostic-note strong {
            color: var(--text-color);
        }

        .levels-grid {
            display: grid;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .level-card {
            background: white;
            border: 2px solid #E0E0E0;
            border-radius: var(--radius);
            box-shadow: 0 4px 0px #E0E0E0;
            padding: var(--spacing-md);
            display: grid;
            grid-template-columns: auto 1fr;
            gap: var(--spacing-md);
            align-items: center;
            color: inherit;
            text-decoration: none;
        }

        .level-card.available {
            border-color: var(--primary-color);
            box-shadow: 0 5px 0px #e6952d;
        }

        .level-card.in-progress {
            border-color: var(--secondary-color);
            box-shadow: 0 5px 0px #C4D8F3;
        }

        .level-card.completed {
            border-color: var(--success-color);
            box-shadow: 0 5px 0px #00a383;
        }

        .level-card.locked {
            background: #F0F0F0;
            color: #8A9197;
            cursor: not-allowed;
        }

        .level-badge {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: white;
            background: #BDBDBD;
        }

        .available .level-badge {
            background: var(--primary-color);
        }

        .in-progress .level-badge {
            background: var(--secondary-color);
        }

        .completed .level-badge {
            background: var(--success-color);
        }

        .level-content h3 {
            margin-bottom: var(--spacing-xs);
        }

        .level-status {
            font-size: 0.85rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-top: var(--spacing-xs);
        }

        .actions {
            margin-top: auto;
            padding-bottom: var(--spacing-xl);
        }

        .header-link {
            color: var(--text-muted);
            font-weight: 800;
            text-decoration: none;
            padding: var(--spacing-sm);
        }
    </style>
</head>
<body>
    <main class="container fade-in">
        <header class="levels-header">
            <span class="header-section-name" data-i18n="levelMap">Level map</span>
            <div class="progress-container">
                <div class="progress-bar-bg" aria-hidden="true">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
                <span class="progress-text" id="progressText" data-i18n="progressPending">Placement pending</span>
            </div>
            <a href="dashboard.html" class="header-link" data-i18n="backHome">Back home</a>
        </header>

        <h1 class="main-title" data-i18n="levelsTitle">Your learning path</h1>
        <div class="diagnostic-note" id="diagnosticNote">
            <span data-i18n-html="levelsNote"><strong>Start:</strong> you can start from A1 or take a placement test to find your level.</span>
        </div>

        <section class="levels-grid" id="levelsGrid" aria-label="Level modules"></section>

        <div class="actions">
            <a href="lesson.html" class="btn btn-secondary" id="practiceLink" data-i18n="guidedPracticeBack">Back to guided practice</a>
            <a href="evaluation.html" class="btn btn-primary" id="diagnosticLink" data-i18n="takePlacement">Take placement test</a>
        </div>
    </main>

    <script src="../js/learning-data.js"></script>
    <script src="../js/i18n.js"></script>
    <script>
        const levelModules = window.ShimiData.levelModules;
        const levels = ['A1', 'A2', 'B1', 'B2'];
        const assignedLevel = localStorage.getItem('shimiAssignedLevel') || 'A1';
        const activeModule = localStorage.getItem('shimiActiveModule');
        const completedModules = JSON.parse(localStorage.getItem('shimiCompletedModules') || '[]');
        const levelsGrid = document.getElementById('levelsGrid');
        const diagnosticNote = document.getElementById('diagnosticNote');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const diagnosticLink = document.getElementById('diagnosticLink');

        function getStatus(level) {
            if (completedModules.includes(level)) return 'completed';
            if (activeModule === level) return 'in-progress';
            if (assignedLevel === level) return 'available';
            return 'locked';
        }

        function getStatusText(status) {
            const labels = {
                completed: window.ShimiI18n.t('completed'),
                'in-progress': window.ShimiI18n.t('inProgress'),
                available: window.ShimiI18n.t('available'),
                locked: window.ShimiI18n.t('locked')
            };
            return labels[status];
        }

        if (!localStorage.getItem('shimiAssignedLevel')) {
            localStorage.setItem('shimiAssignedLevel', 'A1');
        }

        const completedCount = completedModules.length;
        const progress = Math.round((completedCount / levels.length) * 100);
        progressFill.style.width = `${progress}%`;
        function renderLevels() {
            const lang = window.ShimiI18n.getLanguage();
            progressText.textContent = window.ShimiI18n.t('progressModules', { progress });
            diagnosticNote.innerHTML = window.ShimiI18n.t('availableModule', {
                title: lang === 'es' ? levelModules[assignedLevel].titleEs : levelModules[assignedLevel].title
            });
            diagnosticLink.textContent = localStorage.getItem('shimiEvaluationScore')
                ? window.ShimiI18n.t('recalcLevel')
                : window.ShimiI18n.t('takePlacement');

            levelsGrid.innerHTML = levels.map((level) => {
                const module = levelModules[level];
                const status = getStatus(level);
                const tag = status === 'locked' ? 'div' : 'a';
                const href = status === 'locked' ? '' : ` href="level-practice.html?level=${level}"`;
                const title = lang === 'es' ? module.titleEs : module.title;
                const description = lang === 'es' ? module.descriptionEs : module.description;
                return `
                    <${tag} class="level-card ${status}"${href} aria-label="${title}: ${getStatusText(status)}">
                        <div class="level-badge">${level}</div>
                        <div class="level-content">
                            <h3>${title}</h3>
                            <p>${description}</p>
                            <p class="level-status">${getStatusText(status)}</p>
                        </div>
                    </${tag}>
                `;
            }).join('');
        }

        renderLevels();
        window.addEventListener('shimi-language-change', renderLevels);
    </script>
</body>
</html>
